<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture the Base</title>
<meta name="description" content="Capture the Base! Free 5 vs 5 arcade tag in 3D, from the traditional Filipino game of Agawan Base. Play with friends or against AI, right in your browser.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#45b2ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Capture the Base">
<meta property="og:description" content="5 vs 5 arcade tag in 3D. Masks, powerups, guilds and tons of maps.">
<meta property="og:type" content="website">
<meta property="og:image" content="/share_card.jpg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon_512.png">
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #45b2ff; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
#loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; z-index: 10;
	background: linear-gradient(#45b2ff 0%, #c2f0ff 72%, #6fd05a 72.5%, #4eb84c 100%); transition: opacity .35s ease; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; text-align: center; padding: 16px; box-sizing: border-box; }
#loader.done { opacity: 0; pointer-events: none; }
#logo { width: min(82vw, 620px); max-height: 56vh; object-fit: contain; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(20, 10, 60, .35)); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-10px) rotate(.6deg); } }
#track { width: min(70vw, 420px); height: 22px; border-radius: 12px; background: #0a1426; border: 4px solid #fff; box-shadow: 0 4px 0 rgba(18, 58, 107, .35); overflow: hidden; }
#bar { width: 4%; height: 100%; border-radius: 8px; background: linear-gradient(#ffe45c, #ffbc1f); transition: width .15s linear; }
#status { font-weight: 700; font-size: 16px; text-shadow: 0 2px 0 #0a1426; min-height: 20px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser can't run this game.</canvas>
<div id="loader">
	<img id="logo" alt="Capture the Base" src="%LOGO%">
	<div id="track"><div id="bar"></div></div>
	<div id="status">Loading the arena...</div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const statusText = document.getElementById('status');
	const fail = (text) => {
		document.getElementById('track').style.display = 'none';
		statusText.textContent = text;
	};
	// The game calls this once its first frame is on screen.
	window.ctbGameReady = () => {
		window.ctbReady = true;
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 450);
	};
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs: ' + missing.join(', ') + '. Try the latest Chrome, Edge, Firefox or Safari.');
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame({
		onProgress: (current, total) => {
			if (total > 0) {
				const part = Math.max(4, Math.min(100, 100 * current / total));
				bar.style.width = part + '%';
				statusText.textContent = part >= 100 ? 'Starting the game...' : 'Loading the arena... ' + Math.floor(part) + '%';
			}
		},
	}).catch((error) => {
		fail('The game could not start. Check your connection and reload. (' + error + ')');
	});
	// Phones: no scrolling, zooming or long-press menus getting in the way of the thumbs.
	for (const name of ['touchmove', 'gesturestart', 'contextmenu']) {
		document.addEventListener(name, (event) => { if (event.target.tagName !== 'INPUT') { event.preventDefault(); } }, { passive: false });
	}
})();
</script>
</body>
</html>
