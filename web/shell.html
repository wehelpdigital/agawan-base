<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const statusText = document.getElementById('status');
	const fail = (text) => {
		document.getElementById('track').style.display = 'none';
		statusText.textContent = text;
	};
	// The game calls this once its first frame is on screen.
	window.ctbGameReady = () => {
		window.ctbReady = true;
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 450);
	};
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs: ' + missing.join(', ') + '. Try the latest Chrome, Edge, Firefox or Safari.');
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame({
		onProgress: (current, total) => {
			if (total > 0) {
				const part = Math.max(4, Math.min(100, 100 * current / total));
				bar.style.width = part + '%';
				statusText.textContent = part >= 100 ? 'Starting the game...' : 'Loading the arena... ' + Math.floor(part) + '%';
			}
		},
	}).catch((error) => {
		fail('The game could not start. Check your connection and reload. (' + error + ')');
	});
	// Phones: no scrolling, zooming or long-press menus getting in the way of the thumbs.
	for (const name of ['touchmove', 'gesturestart', 'contextmenu']) {
		document.addEventListener(name, (event) => { if (event.target.tagName !== 'INPUT') { event.preventDefault(); } }, { passive: false });
	}
})();
</script>
